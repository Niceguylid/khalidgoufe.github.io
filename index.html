<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11110f">
  <meta name="description" content="Khalid Alwaleed Goufe">
  <title>Khalid Alwaleed Goufe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; --bg:#11110f; --ivory:#eee9df; --gold:#bda779; --muted:#817b70; }
    * { box-sizing: border-box; }
    html, body { min-height:100%; }
    body {
      margin:0; min-height:100vh; display:grid; place-items:center; overflow:hidden;
      color:var(--ivory); background:
        radial-gradient(ellipse at 50% 46%, rgba(189,167,121,.09), transparent 42%),
        var(--bg);
      font-family:"DM Sans", sans-serif;
    }
    body::before {
      content:""; position:fixed; inset:22px; border:1px solid rgba(189,167,121,.22);
      pointer-events:none;
    }
    main { position:relative; z-index:1; width:min(900px, calc(100% - 64px)); text-align:center; padding:64px 0; }
    .monogram {
      color:var(--gold); font-family:"Cormorant Garamond",serif; font-size:clamp(22px,3vw,30px);
      letter-spacing:.34em; padding-left:.34em; margin-bottom:42px;
    }
    .rule { width:46px; height:1px; background:var(--gold); opacity:.8; margin:0 auto 32px; }
    h1 {
      margin:0; font-family:"Cormorant Garamond",serif; font-weight:400;
      font-size:clamp(42px,8vw,82px); line-height:1.02; letter-spacing:.015em;
    }
    .bottom-rule { width:46px; height:1px; background:var(--gold); opacity:.8; margin:34px auto 0; }
    @media (max-width:520px) {
      body::before { inset:12px; }
      main { width:calc(100% - 52px); }
      h1 { font-size:clamp(38px,11vw,58px); }
    }
  </style>
</head>
<body>
  <main aria-label="Khalid Alwaleed Goufe">
    <div class="monogram">KAG</div>
    <div class="rule"></div>
    <h1>Khalid Alwaleed Goufe</h1>
    <div class="bottom-rule"></div>
  </main>
</body>
</html>
